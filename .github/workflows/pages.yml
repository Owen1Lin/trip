name: Publish travel planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/trip-ci --no-audit --no-fund playwright@1.62.1
          /tmp/trip-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser acceptance checks
        env:
          NODE_PATH: /tmp/trip-ci/node_modules
        run: |
          set -euo pipefail
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          python3 -m http.server 3000 --bind 127.0.0.1 > /tmp/trip-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:3000/ > /dev/null
          node tests/planner.test.cjs
          node tests/cloud.test.cjs
          node tests/link-import.test.cjs
          node tests/mobile-flow.test.cjs
          node tests/auth-session.test.cjs
          node tests/quick-entry.test.cjs
          node tests/flexible-parser.test.cjs
          node tests/flexible-flow.test.cjs
          node tests/rich-backend.test.cjs
          node tests/rich-import-security.test.cjs
          node tests/rich-captions.test.cjs
          node tests/rich-worker-auth.test.cjs
          node tests/rich-jobs-backend.test.cjs
          node tests/rich-import.test.cjs
          node tests/rich-jobs-browser.test.cjs
          node tests/appearance.test.cjs
          node tests/appearance-sync.test.cjs
          python3 tests/worker_test.py
  cloud-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Google login and private database
        run: node tests/supabase.test.cjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check cloud.js
          node --check cloud-config.js
          node --check link-import.js
          node --check mobile-ui.js
          node --check quick-entry.js
          node --check import-store.js
          node --check import-ocr.js
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html styles.css app.js cloud.js cloud-config.js link-import.js mobile-ui.js quick-entry.js import-store.js import-ocr.js public/
          cp -R assets public/assets
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
